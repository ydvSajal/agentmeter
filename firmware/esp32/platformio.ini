; AgentMeter device firmware. Board: ESP32-S3 DevKitC-1 (UART port = COM/CH343).
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:scripts/generate-vectors.py
lib_deps =
    olikraus/U8g2@^2.35.30
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0
    rweather/Crypto@^0.4.0

[env:receipt-selftest]
extends = env:esp32-s3
build_flags = -DRECEIPT_SELF_TEST
