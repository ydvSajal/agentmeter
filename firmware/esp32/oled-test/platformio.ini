; OLED + relay-pin smoke test for ESP32-S3 DevKitC-1 (separate from the real firmware).
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.30
build_flags =
    -DOLED_SH1106                 ; panel is SH1106 (132-col RAM); remove for a true SSD1306
